spring.application.name=marketplace
server.port=8080

spring.datasource.url=jdbc:h2:mem:marketplace;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Keep the table and column names exactly as in the spec (ListingLog, LogId, ...).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jackson.generator.write-bigdecimal-as-plain=true
spring.jackson.serialization.write-dates-as-timestamps=false

server.error.include-stacktrace=never
server.error.include-message=never
